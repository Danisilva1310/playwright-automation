name: Execução de Testes E2E - Playwright

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  e2e-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Instalar Dependências
        run: npm ci

      - name: Instalar Browsers do Playwright
        run: npx playwright install --with-deps[cite: 15]

      - name: Executar Testes E2E
        run: npm run test:e2e[cite: 15]

      - name: Publicar Relatórios JUnit
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: 'junit.xml'[cite: 16, 17]